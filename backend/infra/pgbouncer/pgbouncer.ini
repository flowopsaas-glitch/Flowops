[databases]
flowops_engine = host=flowops-db port=5432 dbname=flowops_engine

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

max_client_conn = 500
default_pool_size = 25

ignore_startup_parameters = extra_float_digits

admin_users = kadi
