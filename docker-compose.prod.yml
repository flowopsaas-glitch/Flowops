# Production overrides for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This file overrides only the values that differ in production (real domain,
# no host port bindings for the API, resource limits). Everything else is
# inherited from docker-compose.yml.
#
# REQUIRES Docker Compose v2.24.4+ — the `!override` / `!reset` tags below are
# ignored-or-fatal on older releases, and without them Compose APPENDS port
# lists instead of replacing them (see the notes on each service).

name: flowops

services:
  frontend:
    restart: always
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: 3000
      NGINX_PORT: 80
    # In production the frontend container is exposed on port 80 and reached
    # via the Cloudflare tunnel (or a reverse proxy). We bind to 127.0.0.1 so
    # only cloudflared / nginx on the host can reach it directly.
    #
    # !override (Compose 2.24.4+) REPLACES the base file's port list instead of
    # appending to it. Without the tag the base "8080:80" (bound to 0.0.0.0)
    # and this "127.0.0.1:8080:80" are two distinct entries — Compose keeps
    # both, and Docker then fails to start with "address already in use"
    # while the merged config still publishes 8080 on every interface.
    ports: !override
      - "127.0.0.1:8080:80"

  api:
    restart: always
    # Do NOT expose the API port to the host in production — traffic flows
    # through the frontend nginx proxy only.
    # `!reset []` (not `[]`) so this also clears any binding a future base-file
    # change might add — see deploy/docker-compose.vps.yml for the full note.
    ports: !reset []
    environment:
      NODE_ENV: production

  postgres:
    restart: always
    # Postgres is internal-only — never exposed to the host in production.
    ports: !reset []

  redis:
    restart: always
    ports: !reset []

  # ── Automated database backup ──────────────────────────────────────────
  # Runs pg_dump every 6 hours, keeps 28 files (7 days × 4/day) locally in
  # the `postgres-backups` named volume. For off-site durability, mount that
  # volume to an rclone/S3 destination or rsync it to a remote server.
  #
  # To list backups:
  #   docker compose exec postgres-backup ls -lh /backups
  #
  # To restore from a backup:
  #   docker compose exec -T postgres \
  #     sh -c 'gunzip -c /backups/<file>.sql.gz | psql -U $POSTGRES_USER $POSTGRES_DB'
  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [flowops-net]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres-backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-flowops}
      POSTGRES_DB: ${POSTGRES_DB:-flowops}
    # Dump every 6 hours; retain last 28 files (7 days × 4/day).
    command: >
      sh -c '
        set -e
        echo "Backup service started. Dumping every 6h, retaining 28 files."
        while true; do
          FILE="/backups/flowops_$$(date +%Y%m%d_%H%M%S).sql.gz"
          echo "Dumping to $$FILE ..."
          pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > "$$FILE"
          echo "Dump complete: $$(du -sh $$FILE | cut -f1)"
          ls -t /backups/*.sql.gz 2>/dev/null | tail -n +29 | xargs -r rm -v
          echo "Sleeping 6h..."
          sleep 21600
        done
      '

volumes:
  postgres-backups:
    driver: local
