name: Debug Vitest (temporary)
on:
  push:
    branches: [arena/154c2a8f-flowops]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run vitest and publish output to scratch branch
        run: |
          set +e
          npx vitest run > /tmp/vitest-out.txt 2>&1
          echo "VITEST_EXIT=$?" >> /tmp/vitest-out.txt
          tail -5 /tmp/vitest-out.txt
          cd "$GITHUB_WORKSPACE"
          git config user.email "ci@flowops.local"
          git config user.name "ci-debug"
          git checkout --orphan ci/vitest-debug
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/vitest-out.txt vitest-out.txt
          git add vitest-out.txt
          git commit -m "debug vitest output"
          git push -f origin ci/vitest-debug
