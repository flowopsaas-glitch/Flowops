name: FlowOps CI

# Triggers:
# - push to main / develop : run tests + smoke-test image + push image (sha + branch tag)
# - push of v* tag         : run tests + smoke-test image + push image (semver tags + latest)
# - pull_request to main   : run tests + smoke-test image (no push)
# - workflow_dispatch      : manual rebuild for emergency cases

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default permissions: read-only. Individual jobs (frontend-image) widen
# what they need.
permissions:
  contents: read

jobs:
  detect:
    name: Detect Project Layout
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.check.outputs.has_backend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f "backend/package.json" ]; then
            echo "Backend detected."
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend/ directory in repo - backend & e2e jobs will be skipped."
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

  # ────────────────────────────────────────────────────────────────────────
  # Compose config guard.
  #
  # The VPS / production overlays remove host port bindings so that the only
  # way in is the Cloudflare tunnel. Compose APPENDS list fields across -f
  # files, so `ports: []` in an overlay silently does nothing and the base
  # file's 0.0.0.0:8080 / 0.0.0.0:8081 bindings survive. The overlays use
  # `!reset []` / `!override` for that, and this job is the regression test
  # for it: it resolves the REAL merged config with the runner's Compose and
  # fails if anything is still published on a non-loopback interface.
  # ────────────────────────────────────────────────────────────────────────
  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    env:
      # Only needed so `docker compose config` can interpolate the base file
      # (docker-compose.yml marks these as required with ${VAR:?...}). These are
      # throwaway values — nothing is built, run or connected to here.
      POSTGRES_PASSWORD: ci-placeholder
      JWT_SECRET: ci-placeholder
      JWT_REFRESH_SECRET: ci-placeholder
      OWNER_SEED_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Show Compose version
        run: docker compose version

      - name: Base compose file is valid
        run: docker compose -f docker-compose.yml config --quiet

      - name: VPS overlay publishes no host ports
        run: |
          chmod +x scripts/check-compose-ports.sh
          ./scripts/check-compose-ports.sh \
            -f docker-compose.yml \
            -f deploy/docker-compose.vps.yml

      - name: Production overlay publishes no non-loopback ports
        env:
          ALLOW_LOOPBACK: "1"
        run: |
          chmod +x scripts/check-compose-ports.sh
          ./scripts/check-compose-ports.sh \
            -f docker-compose.yml \
            -f docker-compose.prod.yml

      - name: TEMP DEBUG - dump merged prod ports
        if: always()
        run: |
          CFG="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json || true)"
          echo "::error::$(printf '%s' "$CFG" | jq -c '.services | to_entries | map({svc: .key, ports: (.value.ports // [])})')"

      - name: Observability overlay is valid
        run: docker compose -f docker-compose.yml -f docker-compose.otel.yml config --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        # tsconfig.json (root) extends tsconfig.app.json so both
        # `npx tsc --noEmit` and `npx tsc --project tsconfig.app.json --noEmit`
        # work. Explicit project flag is kept as a belt-and-suspenders.
        run: npx tsc --project tsconfig.app.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_backend == 'true'
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowops_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: flowops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://flowops_test:test_password@localhost:5432/flowops_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # JWT_SECRET now comes from a repo secret. If unset (e.g. on a forked
      # PR where secrets aren't injected), the backend test bootstrap is
      # expected to fail loudly with a clear "JWT_SECRET is empty" error
      # rather than silently using a hardcoded fallback that leaks.
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy || npx prisma migrate dev

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee backend-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::${line}"
            done < backend-build.log
            exit "$status"
          fi

      - name: Upload backend build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: backend/backend-build.log
          retention-days: 7

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e --if-present

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [detect, frontend, backend]
    if: needs.detect.outputs.has_backend == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Playwright
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # Frontend container image: build, smoke-test, push to GHCR.
  #
  # Image:    ghcr.io/<owner>/<repo>-frontend
  # Tags:     - branch (e.g. main, develop) on branch pushes
  #           - semver (v1.2.3, 1.2, 1) on tag pushes
  #           - sha-<short> always
  #           - latest only on default branch pushes
  # Pushes:   only on `push` events. PRs and workflow_dispatch from a
  #           fork build the image and run the smoke test but do NOT
  #           publish (the registry login step is skipped for those).
  # Multi-arch: linux/amd64 + linux/arm64 (Graviton-ready).
  # ────────────────────────────────────────────────────────────────────────
  frontend-image:
    name: Frontend Image (build & push)
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
      packages: write
      security-events: write   # needed for SARIF upload to GitHub Security tab
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skip registry login on PR builds and workflow_dispatch — those don't
      # push, so they don't need credentials. (Forked PRs can't access
      # GITHUB_TOKEN with packages:write anyway.)
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=FlowOps Frontend
            org.opencontainers.image.description=FlowOps web SPA, served by nginx with envsubst-templated upstream
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Step 1: single-arch (amd64) build, loaded into the local Docker so
      # we can `docker run` it for the smoke test. Multi-arch + load-into-
      # docker are mutually exclusive in buildx, so we do the smoke test
      # on amd64 only and multi-arch the push.
      - name: Build (amd64, for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          tags: flowops-frontend:smoke-test
          build-args: |
            VITE_API_URL=/api/v1
            VITE_APP_ENV=${{ github.ref_type == 'tag' && 'production' || 'staging' }}
            VITE_APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.VITE_OTEL_EXPORTER_OTLP_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          set -euo pipefail

          # Run the container with a stub backend hostname — the smoke test
          # exercises nginx itself, not the proxied backend. /healthz is
          # served by nginx directly so it's reachable without a real API.
          docker run --rm -d \
            --name flowops-frontend-smoke \
            -p 8080:80 \
            -e BACKEND_HOST=stub.invalid \
            -e BACKEND_PORT=3000 \
            flowops-frontend:smoke-test

          # Give nginx up to 30s to start.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "[$i] /healthz reachable"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "FAIL: container never became healthy"
              docker logs flowops-frontend-smoke || true
              exit 1
            fi
            sleep 1
          done

          # /healthz returns the literal string "ok"
          body=$(curl -fsS http://localhost:8080/healthz)
          if [ "$body" != "ok" ]; then
            echo "FAIL: /healthz returned '$body', expected 'ok'"
            docker logs flowops-frontend-smoke
            exit 1
          fi
          echo "PASS: /healthz returned 'ok'"

          # Index page renders an HTML doctype. Capture the response before
          # grepping so `set -o pipefail` does not turn curl's expected
          # SIGPIPE (from `head`) into a false smoke-test failure.
          index_body=$(curl -fsS http://localhost:8080/)
          if ! printf '%s' "$index_body" | grep -qi "<!doctype html>"; then
            echo "FAIL: / did not return an HTML index"
            printf '%s' "$index_body" | head -c 500
            docker logs flowops-frontend-smoke
            exit 1
          fi
          echo "PASS: / served an HTML index"

          # Hardened security headers are present.
          headers=$(curl -fsSI http://localhost:8080/)
          for header in "Strict-Transport-Security" "Content-Security-Policy" "X-Frame-Options" "X-Content-Type-Options" "Referrer-Policy"; do
            if ! echo "$headers" | grep -qi "^$header:"; then
              echo "FAIL: missing security header '$header'"
              echo "--- response headers ---"
              echo "$headers"
              docker logs flowops-frontend-smoke
              exit 1
            fi
          done
          echo "PASS: all expected security headers present"

          docker stop flowops-frontend-smoke

      # ── Trivy image scan ───────────────────────────────────────────────
      # Scan the freshly built image for OS + app CVEs before we push it.
      # CRITICAL findings → exit 1 (hard fail).
      # HIGH findings → reported in SARIF only (visible in Security tab).
      # The amd64 image is already loaded from the smoke-test step, so
      # Trivy scans it from the local Docker daemon — no extra pull needed.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flowops-frontend:smoke-test
          format: sarif
          output: trivy-image-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Upload image SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && hashFiles('trivy-image-results.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Enforce critical image vulnerabilities
        id: frontend_image_critical_gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flowops-frontend:smoke-test
          format: json
          output: trivy-frontend-critical.json
          severity: 'CRITICAL'
          exit-code: '1'
          vuln-type: 'os,library'
          ignore-unfixed: true

      # Keep the machine-readable Trivy report as a downloadable artifact and
      # mirror each finding into the run annotations/summary. This repository
      # does not have code scanning enabled, so the annotations make the
      # blocking finding reviewable even when the SARIF upload has nowhere to
      # display it.
      - name: Publish frontend critical scan details
        if: always()
        shell: bash
        run: |
          if [ ! -s trivy-frontend-critical.json ]; then
            echo "Trivy did not produce a frontend critical report."
            exit 0
          fi
          {
            echo "## Frontend image critical findings"
            echo
            echo '| ID | Package | Installed | Fixed | Severity |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r --arg nofix "not fixed" '.Results[]?.Vulnerabilities[]? | "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // $nofix) | \(.Severity) |"' trivy-frontend-critical.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r --arg nofix "no fixed version" '.Results[]?.Vulnerabilities[]? | "::error title=Frontend image \(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) is \(.Severity); fixed in \(.FixedVersion // $nofix)"' trivy-frontend-critical.json

      - name: Upload frontend critical scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-critical
          path: trivy-frontend-critical.json
          if-no-files-found: warn

      - name: Fail on critical frontend image vulnerabilities
        if: steps.frontend_image_critical_gate.outcome == 'failure'
        run: |
          echo "A CRITICAL frontend image vulnerability was found. Review the annotations, summary, or trivy-frontend-critical artifact."
          exit 1

      # Step 2: multi-arch build & push. Reuses the BuildKit cache from
      # step 1, so the amd64 layers don't rebuild — only arm64 is added.
      - name: Build & push (multi-arch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api/v1
            VITE_APP_ENV=${{ github.ref_type == 'tag' && 'production' || 'staging' }}
            VITE_APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.VITE_OTEL_EXPORTER_OTLP_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise pushed image
        if: github.event_name == 'push'
        run: |
          {
            echo "## Frontend image published"
            echo ""
            echo "Pushed tags:"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull on AWS ECS Fargate / local with:"
            echo ""
            echo '```'
            echo "docker pull ${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate envs/staging
        working-directory: infra/terraform/envs/staging
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate envs/production
        working-directory: infra/terraform/envs/production
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate modules (init + validate per skeleton)
        run: |
          set -e
          for m in frontend-cdn network backend-ecs database cache secrets; do
            echo "::group::module/$m"
            cd "infra/terraform/modules/$m"
            terraform init -backend=false
            terraform validate
            cd - >/dev/null
            echo "::endgroup::"
          done


  # ──────────────────────────────────────────────────────────────────────────
  # Dependency / filesystem security scan (Trivy).
  #
  # Scans both frontend and backend package-lock.json for known CVEs.
  # Runs in parallel with the image jobs — no docker build needed.
  # CRITICAL findings fail the job; results always upload to the GitHub
  # Security tab so HIGH findings are visible and trackable.
  # ──────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # The report scan is non-blocking so both lockfiles are scanned and
      # uploaded even when one contains a finding. The explicit CRITICAL-only
      # gates below enforce the policy documented above; HIGH findings remain
      # visible in SARIF and in the human-readable summaries.
      - name: Scan frontend for CVEs (Trivy)
        id: frontend_dependency_report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-fs-frontend.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          vuln-type: 'library'
          ignore-unfixed: true

      - name: Upload frontend SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && hashFiles('trivy-fs-frontend.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-fs-frontend.sarif
          category: trivy-frontend

      - name: Scan backend for CVEs (Trivy)
        id: backend_dependency_report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-fs-backend.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          vuln-type: 'library'
          ignore-unfixed: true

      - name: Upload backend SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && hashFiles('trivy-fs-backend.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-fs-backend.sarif
          category: trivy-backend-deps

      - name: Enforce critical frontend dependency findings
        id: frontend_dependency_gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: table
          severity: 'CRITICAL'
          exit-code: '1'
          vuln-type: 'library'
          ignore-unfixed: true
        continue-on-error: true

      - name: Enforce critical backend dependency findings
        id: backend_dependency_gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: table
          severity: 'CRITICAL'
          exit-code: '1'
          vuln-type: 'library'
          ignore-unfixed: true
        continue-on-error: true

      - name: Fail on critical dependency findings
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.frontend_dependency_gate.outcome }}" == "failure" || \
                "${{ steps.backend_dependency_gate.outcome }}" == "failure" ]]; then
            echo "A CRITICAL dependency vulnerability was found. See the Trivy report above."
            exit 1
          fi

      # Human-readable table for the workflow logs (informational, no fail)
      - name: Print frontend CVE summary
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          vuln-type: 'library'
          ignore-unfixed: true

      - name: Print backend CVE summary
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          vuln-type: 'library'
          ignore-unfixed: true


  # ────────────────────────────────────────────────────────────────────────
  # Backend container image: build, smoke-test, push to GHCR.
  # Mirrors the frontend-image job pattern.
  # ────────────────────────────────────────────────────────────────────────
  backend-image:
    name: Backend Image (build & push)
    runs-on: ubuntu-latest
    needs: backend
    if: needs.detect.outputs.has_backend == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (amd64, for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          tags: flowops-backend:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test backend image (real NestJS boot)
        run: |
          set -euo pipefail

          # Spin up a throw-away Postgres so Prisma can connect and the NestJS
          # module graph fully initialises — catches broken imports, missing
          # providers, and schema mismatches the old plain-http stub missed.
          docker network create smoke-net

          docker run --rm -d \
            --name smoke-postgres \
            --network smoke-net \
            -e POSTGRES_USER=smoke \
            -e POSTGRES_PASSWORD=smoke \
            -e POSTGRES_DB=smoke \
            postgres:16-alpine

          # Wait for Postgres (up to 30s)
          for i in $(seq 1 30); do
            if docker exec smoke-postgres pg_isready -U smoke >/dev/null 2>&1; then
              echo "[$i] Postgres ready"; break
            fi
            [ "$i" = "30" ] && echo "FAIL: Postgres never became ready" && exit 1
            sleep 1
          done

          # Generate unique secrets so the startup same-secret guard doesn't trip
          ACC_SECRET="smoke-access-$(openssl rand -hex 8)"
          REF_SECRET="smoke-refresh-$(openssl rand -hex 8)"

          docker run --rm -d \
            --name flowops-backend-smoke \
            --network smoke-net \
            -p 3001:3000 \
            -e DATABASE_URL="postgresql://smoke:smoke@smoke-postgres:5432/smoke" \
            -e JWT_SECRET="$ACC_SECRET" \
            -e JWT_REFRESH_SECRET="$REF_SECRET" \
            -e OWNER_SEED_EMAIL="smoke@test.local" \
            -e OWNER_SEED_PASSWORD="SmokeTest123!" \
            -e NODE_ENV="production" \
            -e REDIS_HOST="localhost" \
            -e REDIS_PORT="6379" \
            flowops-backend:smoke-test

          # Wait for NestJS /health endpoint (up to 60s)
          echo "Waiting for NestJS /health..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "[$i] /health reachable — NestJS fully booted"; break
            fi
            if [ "$i" = "60" ]; then
              echo "FAIL: backend never became healthy"
              docker logs flowops-backend-smoke | tail -50
              docker stop flowops-backend-smoke smoke-postgres 2>/dev/null || true
              docker network rm smoke-net 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          body=$(curl -fsS http://localhost:3001/health)
          echo "Health: $body"
          echo "PASS: NestJS backend booted and /health responded"

          docker stop flowops-backend-smoke smoke-postgres 2>/dev/null || true
          docker network rm smoke-net 2>/dev/null || true

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flowops-backend:smoke-test
          format: sarif
          output: trivy-backend-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Upload backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && hashFiles('trivy-backend-results.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

      - name: Enforce critical backend image vulnerabilities
        id: backend_image_critical_gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flowops-backend:smoke-test
          format: json
          output: trivy-backend-critical.json
          severity: 'CRITICAL'
          exit-code: '1'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Publish backend critical scan details
        if: always()
        shell: bash
        run: |
          if [ ! -s trivy-backend-critical.json ]; then
            echo "Trivy did not produce a backend critical report."
            exit 0
          fi
          {
            echo "## Backend image critical findings"
            echo
            echo '| ID | Package | Installed | Fixed | Severity |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r --arg nofix "not fixed" '.Results[]?.Vulnerabilities[]? | "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // $nofix) | \(.Severity) |"' trivy-backend-critical.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r --arg nofix "no fixed version" '.Results[]?.Vulnerabilities[]? | "::error title=Backend image \(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) is \(.Severity); fixed in \(.FixedVersion // $nofix)"' trivy-backend-critical.json

      - name: Upload backend critical scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-critical
          path: trivy-backend-critical.json
          if-no-files-found: warn

      - name: Fail on critical backend image vulnerabilities
        if: steps.backend_image_critical_gate.outcome == 'failure'
        run: |
          echo "A CRITICAL backend image vulnerability was found. Review the annotations, summary, or trivy-backend-critical artifact."
          exit 1

      - name: Build & push (multi-arch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise pushed image
        if: github.event_name == 'push'
        run: |
          {
            echo "## Backend image published"
            echo ""
            echo "Pull: \`docker pull ${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)\`"
          } >> "$GITHUB_STEP_SUMMARY"
