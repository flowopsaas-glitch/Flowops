// FlowOps — security-only unattended upgrades.
//
// Installed to /etc/apt/apt.conf.d/52flowops-unattended-upgrades.conf by
// deploy/host-patch.sh --install (and by deploy/harden-vps.sh).
//
// WHY THIS FILE EXISTS
// --------------------
// The 2026-11-04 host login read:
//
//     35 updates can be applied immediately.
//     5 of these updates are standard security updates.
//
// Security updates should never have been in that list. Ubuntu's unattended-
// upgrades handles them daily — but only if it is enabled, only for the pockets
// listed here, and the default file ships with the release pocket and security
// commented out on some images. A production host whose "automatic security
// updates" are configured but not running looks identical to one that is
// patched, right up until you read the log.
//
// SCOPE, DELIBERATELY NARROW
// --------------------------
//   * security pockets and ESM only — never -updates, never -backports. Feature
//     updates on a server wait for the window in flowops-host-patch --full.
//   * docker-ce is NOT here. It comes from Docker's own repository, which has no
//     security pocket, so this file cannot reach it by origin. That is also the
//     right answer: a docker-ce update restarts the daemon, and without
//     live-restore that stops every container. It is applied by
//     `flowops-host-patch --full`, in a window, with the stack verified after.
//   * no automatic reboot. A kernel fix installs and waits for the operator.
//     Reboots are the one action that can turn a patched host into an outage.
//
// DO NOT ALSO EDIT /etc/apt/apt.conf.d/50unattended-upgrades. That file belongs
// to the package; anything set in both is resolved by file order, which makes
// the effective policy wall-paper. This file is 52- so it wins, and it is the
// only one FlowOps owns.

Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}";
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
};

// An interrupted dpkg (power loss, OOM mid-upgrade) must not stay interrupted.
Unattended-Upgrade::AutoFixInterruptedDpkg "true";

// A full /boot is how a running host becomes un-bootable after a kernel update:
// the next kernel cannot install because the old ones are still there.
// Removing unused kernel packages is safe — the RUNNING kernel is never a
// candidate for removal.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";

// Deliberately false. `autoremove` on a production host can remove a library a
// manually-built service still links against, and there is no undo. The disk
// guard plus the monthly --full run (which autoremoves in a window, watched)
// covers the space this would have reclaimed.
Unattended-Upgrade::Remove-Unused-Dependencies "false";

// The kernel of this setup: install the fix, never reboot by itself.
Unattended-Upgrade::Automatic-Reboot "false";

// Keep the terminal quiet and the journal honest.
Unattended-Upgrade::SyslogEnable "true";

// Do not let a download failure leave the box half-updated.
Unattended-Upgrade::MinimalSteps "true";
