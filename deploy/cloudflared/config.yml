# ══════════════════════════════════════════════════════════════════════════
#  Cloudflare Tunnel — FlowOps VPS Configuration
#
#  This file goes on the VPS at: /etc/cloudflared/config.yml
#
#  SETUP:
#  1. Install cloudflared on VPS (the setup script handles this)
#  2. Authenticate:       cloudflared tunnel login
#  3. Create tunnel:      cloudflared tunnel create flowops-app
#  4. Copy the credentials JSON to /etc/cloudflared/<TUNNEL_ID>.json
#  5. Replace TUNNEL_ID below with your actual tunnel ID
#  6. In Cloudflare DNS, add CNAME records pointing to <TUNNEL_ID>.cfargotunnel.com:
#       - app.flowop.work   → <TUNNEL_ID>.cfargotunnel.com (Proxied)
#       - api.flowop.work   → <TUNNEL_ID>.cfargotunnel.com (Proxied)
#       - driver.flowop.work→ <TUNNEL_ID>.cfargotunnel.com (Proxied)
#       - flowop.work       → <TUNNEL_ID>.cfargotunnel.com (Proxied)
#       - www.flowop.work   → <TUNNEL_ID>.cfargotunnel.com (Proxied)
#
#  The tunnel runs as a Docker container (see docker-compose.vps.yml) and
#  reads this config from the bind-mounted /etc/cloudflared/ directory.
# ══════════════════════════════════════════════════════════════════════════

# Replace with your actual tunnel ID (from `cloudflared tunnel create flowops-app`)
tunnel: CHANGE_ME_TUNNEL_ID

# Path to the credentials file (auto-generated by `cloudflared tunnel create`)
credentials-file: /etc/cloudflared/CHANGE_ME_TUNNEL_ID.json

# ── Ingress Rules ─────────────────────────────────────────────────────────
# Routes incoming requests to the correct local service based on hostname.
# Services are on the Docker bridge network, accessed via 127.0.0.1 on host.

ingress:
  # ── Main web app (app.flowop.work) ────────────────────────────────────
  # Routes to frontend nginx which serves the SPA and proxies /api/ + /socket.io/
  - hostname: app.flowop.work
    service: http://localhost:8080
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # ── Direct API access (api.flowop.work) ────────────────────────────────
  # Routes directly to the NestJS backend for webhook callbacks, OAuth, etc.
  # Webhooks (Paystack, WhatsApp, Meta) hit this directly.
  - hostname: api.flowop.work
    service: http://localhost:8080
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      # Allow large file uploads (waybill scans, POD images)
      httpHostHeader: api.flowop.work

  # ── Driver Portal (driver.flowop.work) ─────────────────────────────────
  # Standalone PWA for drivers — phone + PIN auth
  - hostname: driver.flowop.work
    service: http://localhost:8081
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # ── Root domain + www ──────────────────────────────────────────────────
  # Redirect to the main app (or serve a landing page in future)
  - hostname: flowop.work
    service: http://localhost:8080
    originRequest:
      noTLSVerify: true

  - hostname: www.flowop.work
    service: http://localhost:8080
    originRequest:
      noTLSVerify: true

  # ── Platform admin (platform.flowop.work) ──────────────────────────────
  # Same frontend — the SPA handles admin routing internally
  - hostname: platform.flowop.work
    service: http://localhost:8080
    originRequest:
      noTLSVerify: true

  # ── Catch-all (required by cloudflared) ────────────────────────────────
  - service: http_status:404
