# FlowOps — VPS Production Override (Elite Host: 1 CPU, 2GB RAM, 25GB SSD)
#
# Usage:
#   ./deploy/vps-deploy.sh  # application services only
#   ./deploy/cloudflared-maintenance.sh --apply  # approved tunnel-only action
#
# Do not use a broad `docker compose ... up` on the VPS: it can recreate the
# public tunnel as an incidental application deployment.
#
# This file extends the base docker-compose.yml with:
#   - Memory limits tuned for 2GB RAM
#   - Cloudflare Tunnel sidecar (cloudflared)
#   - No host port bindings at all (traffic goes through the tunnel only)
#   - Driver-portal service included
#   - Automated database backups
#
# REQUIRES Docker Compose v2.24+ (deploy/vps-deploy.sh enforces this).
#
# Why `!reset []` instead of `ports: []`:
#   Compose merges LIST fields (ports, volumes, expose, dns, ...) by APPENDING
#   the override's entries to the base file's entries — it does not replace
#   them. So `ports: []` is a silent no-op: the base docker-compose.yml
#   bindings ("${FRONTEND_HOST_PORT:-8080}:80" for frontend,
#   "${DRIVER_PORTAL_HOST_PORT:-8081}:80" for driver-portal) stayed published
#   on 0.0.0.0, defeating the whole point of the tunnel-only design.
#   `!reset []` (Compose 2.24+) clears the inherited value instead of appending
#   to it. See https://docs.docker.com/reference/compose-file/merge/

name: flowops

services:
  frontend:
    restart: always
    # No host port binding — cloudflared reaches frontend via Docker network.
    # This avoids the docker-proxy port binding bug on Ubuntu 26.04 kernels.
    # For local debugging: docker compose exec frontend curl localhost:80/healthz
    # !reset is REQUIRED here: a plain `ports: []` would be merged (appended)
    # into the base file's "8080:80" binding and leave the port published.
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  driver-portal:
    restart: always
    # Clears the base file's "8081:80" binding (see the !reset note at the top).
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  api:
    restart: always
    # No host port — traffic flows through frontend nginx proxy
    ports: !reset []
    environment:
      NODE_ENV: production
      APP_URL: https://app.flowop.work
      CORS_ORIGINS: https://app.flowop.work,https://driver.flowop.work,https://www.flowop.work
      API_PUBLIC_URL: https://api.flowop.work/api/v1
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  postgres:
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    # Tuned for 2GB RAM VPS — conservative shared_buffers
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
        -c wal_buffers=4MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1

  redis:
    restart: always
    ports: !reset []
    # Cap Redis memory — evicts LRU keys if hit
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M

  # ── Cloudflare Tunnel ────────────────────────────────────────────────────
  # Routes traffic from Cloudflare edge to local services without exposing ports.
  # Requires: /etc/cloudflared/config.yml + credentials JSON on the host.
  # Uses Docker service names (frontend:80, driver-portal:80) since we no longer
  # expose host ports — cloudflared talks to containers over the Docker network.
  cloudflared:
    # Explicit release pin. Do not use :latest: a tunnel client change must be
    # reviewed and rolled out with deploy/cloudflared-maintenance.sh, not as an
    # incidental side effect of an application deployment.
    image: cloudflare/cloudflared:2026.9.3
    init: true
    restart: always
    # The native `cloudflared tunnel ready` healthcheck below reads this local
    # /ready endpoint. Loopback keeps diagnostics off the compose network and
    # the service publishes no host port.
    environment:
      TUNNEL_METRICS: 127.0.0.1:2000
    command: tunnel --no-autoupdate --protocol http2 --config /etc/cloudflared/config.yml run
    healthcheck:
      # cloudflared 2026.9.3 has the native `tunnel ready` command; it returns
      # non-zero until the local /ready endpoint has an edge connection.
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - /etc/cloudflared:/etc/cloudflared:ro
    networks: [flowops-net]
    depends_on:
      frontend:
        condition: service_healthy
      driver-portal:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ── Automated database backup ────────────────────────────────────────────
  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [flowops-net]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres-backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-flowops}
      POSTGRES_DB: ${POSTGRES_DB:-flowops}
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    # Dump every 6 hours; retain last 28 files (7 days x 4/day).
    # Each dump is VALIDATED before it's kept: pg_dump must succeed AND the
    # gzipped result must be a real size (>10KB). If Postgres isn't ready yet
    # (e.g. mid-reboot) pg_dump would otherwise write an empty 20-byte file — we
    # detect that, discard it, and retry shortly instead of poisoning the backup
    # folder with a useless "latest" dump.
    command: >
      sh -c '
        MIN_BYTES=10240
        echo "Backup service started. Dumping every 6h (validated), retaining 28 files."
        while true; do
          TS="$$(date +%Y%m%d_%H%M%S)"
          TMP="/backups/.flowops_$$TS.sql.gz.partial"
          FINAL="/backups/flowops_$$TS.sql.gz"
          echo "Dumping to $$FINAL ..."
          if pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > "$$TMP"; then
            SZ=$$(stat -c%s "$$TMP" 2>/dev/null || wc -c < "$$TMP")
            if [ "$$SZ" -ge "$$MIN_BYTES" ] && gzip -t "$$TMP" 2>/dev/null; then
              mv "$$TMP" "$$FINAL"
              echo "Dump OK: $$(du -sh $$FINAL | cut -f1)"
              ls -t /backups/flowops_*.sql.gz 2>/dev/null | tail -n +29 | xargs -r rm -v
              echo "Sleeping 6h..."
              sleep 21600
            else
              echo "REJECTED empty/short dump ($$SZ bytes) — DB likely not ready. Retrying in 60s."
              rm -f "$$TMP"
              sleep 60
            fi
          else
            echo "pg_dump failed (DB not ready?). Retrying in 60s."
            rm -f "$$TMP"
            sleep 60
          fi
        done
      '

volumes:
  postgres-backups:
    driver: local
