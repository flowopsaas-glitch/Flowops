# ... in docker-compose.yml ...

services:
  otel-collector:
    # ... existing config ...
    environment:
      - DEPLOYMENT_ENV=${NODE_ENV:-production}
      - CLUSTER_NAME=flowops-prod
      - OTEL_LOG_LEVEL=info
    ports:
      - "4318:4318"  # OTLP HTTP (frontend sends here)
      - "4317:4317"  # OTLP gRPC (backend sends here)
      - "8889:8889"  # Prometheus exporter (note: different from receiver 8888)
      - "13133:13133"  # Health check
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - flowops-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    # ... existing config ...
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"  # Allow config reload via API
    ports:
      - "9090:9090"  # Prometheus UI
    networks:
      - flowops-net
    depends_on:
      otel-collector:
        condition: service_healthy

  flowops-backend:
    # ... existing config ...
    environment:
      # ... other vars ...
      # OpenTelemetry config for backend
      - OTEL_SERVICE_NAME=flowops-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317  # ← gRPC endpoint
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOG_LEVEL=info
      # Optional: Expose /metrics for Prometheus scraping
      - PROMETHEUS_METRICS_ENABLED=true
      - PROMETHEUS_METRICS_PORT=4000
    # ... rest of config ...

  flowops-platform:
    # ... existing config ...
    build:
      args:
        # Pass OTel config to frontend at build time
        - VITE_OTEL_SERVICE_NAME=flowops-frontend
        - VITE_OTEL_ENDPOINT=https://api.flowop.work/v1/traces  # ← Relative path via Cloudflare
    environment:
      # Runtime env vars (if using runtime config)
      - VITE_OTEL_SERVICE_NAME=flowops-frontend
    # ... rest of config ...
