# nginx config TEMPLATE — rendered at container start by the nginx:alpine
# entrypoint. The variables `${BACKEND_HOST}`, `${BACKEND_PORT}`, and
# `${NGINX_PORT}` are substituted from the runtime environment via envsubst,
# whitelisted by `NGINX_ENVSUBST_FILTER` set in the Dockerfile.
#
# nginx variables (e.g. `$proxy_add_x_forwarded_for`, `$http_upgrade`) are
# NOT in the whitelist so they survive the substitution untouched.
#
# Hardening choices:
# - server_tokens off in the nginx.conf-level main block; we re-assert below.
# - HSTS, X-Frame-Options, CSP, COOP applied with `always` so they're sent on
#   error responses too.
# - X-XSS-Protection deliberately set to "0" (legacy header; modern browsers
#   ignore it, old IE versions had bypasses making it net-negative).
# - Hidden files (.git, .env, ...) blanket-denied.

server {
    listen ${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Docker's embedded DNS resolver — resolves upstream at request time
    # (not at startup), so nginx starts even if the API container isn't
    # ready yet. The variable in proxy_pass forces this path.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://${BACKEND_HOST}:${BACKEND_PORT};

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # ── Security headers (apply to ALL responses, including errors) ─────
    # HSTS: only meaningful when traffic is already on TLS (i.e. you're behind
    # an ALB/CloudFront with a cert). Safe to send unconditionally — browsers
    # ignore HSTS over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    # CSP — deliberately permissive for the SPA's known third-parties:
    # 'unsafe-inline' on script/style covers Vite's runtime + Tailwind
    # generated styles; tighten with nonces in a follow-up PR. `connect-src`
    # allows https/wss for the API + WebSockets + Sentry + OTel collector +
    # eventual Cloudflare R2 asset URLs. `img-src` allows blob/data for
    # capture flows (signature pad, waybill scans).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # ── Cache policy ────────────────────────────────────────────────────
    # Hashed assets — long, immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # PWA service worker — never cached (we want the new SW to update users).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Legacy SW tombstone — must never be cached so stale installs fetch it on
    # their next update check and self-destruct onto the new /sw.js.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # PWA manifest (vite-plugin-pwa emits manifest.webmanifest) — short cache.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=600" always;
    }

    # Index must be revalidated so SPA gets the latest asset hashes after deploys.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Defence in depth: don't serve .git, .env, .ssh etc. even if they sneak
    # into the image (they shouldn't — see frontend/.dockerignore).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Health check (ALB target groups, ECS, k8s liveness/readiness) ───
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-cache" always;
        return 200 'ok';
    }

    # ── API proxy ───────────────────────────────────────────────────────
    location /api/ {
        # Nginx strips CORS headers when proxy_pass uses a variable.
        # Explicitly set them here so the browser always receives them.
        add_header 'Access-Control-Allow-Origin'      $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization' always;

        # Handle pre-flight OPTIONS quickly without hitting the upstream.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' '86400' always;
            return 204;
        }

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Long timeouts for streaming endpoints (e.g. waybill OCR progress).
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 30;
        proxy_buffering off;
    }

    # ── Socket.IO / WebSocket proxy ─────────────────────────────────────
    location /socket.io/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── SPA fallback ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
