global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'flowops'
    environment: 'development'

scrape_configs:
  # Scrape OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['localhost:8888']
    scrape_interval: 10s

  # Scrape backend API metrics (if exposed)
  - job_name: 'flowops-backend'
    static_configs:
      - targets: ['localhost:3000']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Jaeger metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['localhost:16686']
    scrape_interval: 10s
