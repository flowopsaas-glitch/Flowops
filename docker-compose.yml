# FlowOps application stack.
#
# Use cases:
#
#   docker compose up --build
#     Build & run the full stack locally: frontend → api → postgres → redis.
#     Requires `BACKEND_IMAGE` to be set (or for a `flowops/backend:latest`
#     image to exist locally). Set `POSTGRES_PASSWORD` and `JWT_SECRET` first.
#
#   docker compose up --build frontend
#     Just the frontend — useful when you're pointing it at a remote backend
#     via VITE_API_URL.
#
#   docker compose -f docker-compose.yml -f docker-compose.otel.yml up --build
#     With the observability stack (OTel collector + Jaeger + Prometheus).
#
# This compose is the local reference for the eventual AWS task definitions.
# Keep service shapes (env vars, ports, healthchecks) in sync with whatever
# IaC ends up describing the production deployment. See docs/DEPLOYMENT.md.

name: flowops

services:
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Build-time env vars baked into the SPA bundle by Vite.
        # NOTE: VITE_API_URL must be /api/v1 — the SPA uses it verbatim as the
        # axios baseURL and the backend mounts all routes under /api/v1. nginx
        # proxies `location /api/` through, so /api/v1/* resolves. Just /api 404s.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.0.0}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_OLLAMA_URL: ${VITE_OLLAMA_URL:-}
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
        # Clone-tripwire config — set these to the new instance's domain so the
        # integrity beacon doesn't false-fire when served from a non-flowop.work host.
        VITE_CANONICAL_HOSTS: ${VITE_CANONICAL_HOSTS:-}
        VITE_INTEGRITY_BEACON_URL: ${VITE_INTEGRITY_BEACON_URL:-}
        # Paystack public key — safe to include in the frontend bundle
        VITE_PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-pk_test_fa7d0085df63bad80b49faefefb}
    image: ${FRONTEND_IMAGE:-flowops/frontend:${IMAGE_TAG:-latest}}
    environment:
      # Runtime env vars — substituted into the nginx config template by the
      # nginx:alpine entrypoint. The frontend service uses them to know which
      # internal hostname to proxy /api and /socket.io to.
      BACKEND_HOST: ${BACKEND_HOST:-api}
      BACKEND_PORT: ${API_PORT:-3000}
      NGINX_PORT: 80
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    networks: [flowops-net]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  driver-portal:
    # Standalone driver PWA (phone + PIN). Served by nginx, proxies /api to the
    # api service. Single active session is enforced by the backend DriverAuthGuard.
    build:
      context: ./driver-portal
      target: production
      args:
        VITE_API_URL: ${DRIVER_VITE_API_URL:-/api/v1}
    image: ${DRIVER_PORTAL_IMAGE:-flowops/driver-portal:${IMAGE_TAG:-latest}}
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-api}
      BACKEND_PORT: ${API_PORT:-3000}
      NGINX_PORT: 80
    ports:
      - "${DRIVER_PORTAL_HOST_PORT:-8081}:80"
    networks: [flowops-net]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    # Build locally with:  docker compose build api
    # Pull pre-built with: BACKEND_IMAGE=ghcr.io/flowopsaas-glitch/flowops-backend:latest docker compose up
    build:
      context: ./backend
      target: production
    image: ${BACKEND_IMAGE:-flowops/backend:${IMAGE_TAG:-latest}}
    environment:
      # ── Core ────────────────────────────────────────────────────────
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Public URL used in email links (e.g. verify-email, password reset)
      APP_URL: ${APP_URL:-http://localhost:8080}

      # ── Security posture ──────────────────────────────────────────────
      # RBAC_STRICT makes RolesGuard reject (403) any route that carries no
      # deliberate access decision (@Roles / @AnyAuthenticated / @Public /
      # @OwnerOnly). The route inventory is at zero undecided and CI runs the
      # whole backend suite with this forced to "true", so strict mode is the
      # supported production posture — see
      # docs/SECURITY-REVIEW-RBAC-TENANT-2026-10-01.md.
      #
      # THIS LINE IS THE ONLY WAY THE VARIABLE REACHES THE CONTAINER. The api
      # service uses an explicit `environment:` allowlist and no `env_file:`,
      # so a value set in the host .env but absent here is silently dropped —
      # that is exactly how production ran non-strict until an operator
      # hand-edited deploy/docker-compose.vps.yml on 2026-10-25. Do not remove
      # it, and do not "fix" it host-side again.
      #
      # Default is false so a fresh local `docker compose up` cannot 403 a
      # route that only exists in someone's working tree. Set RBAC_STRICT=true
      # in .env to run strict anywhere.
      RBAC_STRICT: ${RBAC_STRICT:-false}

      # ── Database + Cache ─────────────────────────────────────────────
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-flowops}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ── Auth ──────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # JWT_REFRESH_SECRET MUST be different from JWT_SECRET.
      # A shared secret means a leaked access token also compromises refresh tokens.
      # Generate with: openssl rand -hex 32
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (must differ from JWT_SECRET)}
      # Optional independent OTP hash key; a domain-separated key is derived from JWT_SECRET if blank.
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # 32-byte base64/hex key used only for AES-256-GCM encryption of OIDC client secrets.
      SSO_SECRET_ENCRYPTION_KEY: ${SSO_SECRET_ENCRYPTION_KEY:-}
      # 32-byte base64 key for per-tenant integration secrets at rest
      # (WhatsApp, Shopify/WooCommerce, and Xero/Sage OAuth tokens).
      #
      # THIS LINE IS THE ONLY WAY THE VARIABLE REACHES THE CONTAINER — see the
      # note on RBAC_STRICT above. It was absent, so a key set in the host .env
      # was silently dropped and IntegrationCryptoService stayed unconfigured:
      # saving any integration secret failed with "no integration encryption
      # key configured", and accounting OAuth could not connect at all.
      # Default empty on purpose — the service then fails closed with a loud
      # boot warning rather than persisting secrets in clear.
      INTEGRATIONS_ENC_KEY: ${INTEGRATIONS_ENC_KEY:-}
      # Accepted as a fallback by the same service, so installs that already
      # configured customs EDI keep working without a second key.
      CUSTOMS_EDI_KEY: ${CUSTOMS_EDI_KEY:-}

      # ── Owner seed account ────────────────────────────────────────────
      OWNER_SEED_EMAIL: ${OWNER_SEED_EMAIL:-owner@flowops.local}
      OWNER_SEED_PASSWORD: ${OWNER_SEED_PASSWORD:?set OWNER_SEED_PASSWORD in .env}

      # ── Cloudflare R2 ─────────────────────────────────────────────────
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME:-flowops-waybills}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-}

      # ── WhatsApp (Meta Cloud API) ─────────────────────────────────────
      # After running `docker compose up`, configure these with your real values.
      # See backend/.env.example for instructions on where to find each value.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-flowops-webhook-verify}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v19.0}

      # ── Paystack ──────────────────────────────────────────────────────
      # After running `docker compose up`, configure these with your real values.
      # See backend/.env.example for instructions on where to find each value.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_WEBHOOK_IPS: ${PAYSTACK_WEBHOOK_IPS:-52.31.139.75,52.49.173.169,52.214.14.220}

      # ── Email (SendGrid) ──────────────────────────────────────────────
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@flowops.local}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-FlowOps}

      # ── Email (Resend — preferred, takes priority over SendGrid) ──────
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-}

      # ── AI providers ──────────────────────────────────────────────────
      # Groq powers Ask FlowOps, CLAW chat, competitive intel, the AI Support
      # Agent, Courier orchestration, Observatory triage and the Build Planner.
      # WITHOUT these reaching the container, all AI features silently fall back
      # — this block is why they work under compose (not just PM2-on-host).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # ── AISStream (live vessel tracking — free WebSocket AIS feed) ────
      # Get a free key at https://aisstream.io/authenticate. If unset, live
      # vessel tracking is simply disabled (platform runs normally).
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}

      # ── Driver web-push (VAPID) ───────────────────────────────────────
      # Generate once: npx web-push generate-vapid-keys  (or any P-256 keypair,
      # base64url). If unset, driver push is disabled (in-app job list still works).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@flowop.work}
      TAVILY_TIMEOUT_MS: ${TAVILY_TIMEOUT_MS:-15000}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLAW_AGGRESSION_LEVEL: ${CLAW_AGGRESSION_LEVEL:-MEDIUM}

      # ── Public backend URL (SSO + accounting OAuth callbacks) ─────────
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080/api/v1}

      # ── CLAW Build Planner → GitHub issue handoff (optional) ──────────
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # ── Accounting integrations (Xero / Sage OAuth — optional) ────────
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      SAGE_CLIENT_ID: ${SAGE_CLIENT_ID:-}
      SAGE_CLIENT_SECRET: ${SAGE_CLIENT_SECRET:-}

      # ── Geocoding ─────────────────────────────────────────────────────
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-nominatim}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-za}

      # ── Paystack plan codes + error tracking (optional) ───────────────
      PAYSTACK_PROFESSIONAL_PLAN_CODE: ${PAYSTACK_PROFESSIONAL_PLAN_CODE:-}
      PAYSTACK_ENTERPRISE_PLAN_CODE: ${PAYSTACK_ENTERPRISE_PLAN_CODE:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [flowops-net]
    restart: unless-stopped
    healthcheck:
      # Backend MUST expose /health for this to work. If it doesn't, swap to
      # `["CMD-SHELL", "exit 0"]` until it does — but add the endpoint to the
      # backend's hot-path; ALB target groups will need it too.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:${API_PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [flowops-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flowops} -d $${POSTGRES_DB:-flowops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [flowops-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  flowops-net:
    name: flowops-net
    driver: bridge
