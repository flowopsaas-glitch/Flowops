# FlowOps application stack.
#
# Use cases:
#
#   docker compose up --build
#     Build & run the full stack locally: frontend → api → postgres → redis.
#     Requires `BACKEND_IMAGE` to be set (or for a `flowops/backend:latest`
#     image to exist locally). Set `POSTGRES_PASSWORD` and `JWT_SECRET` first.
#
#   docker compose up --build frontend
#     Just the frontend — useful when you're pointing it at a remote backend
#     via VITE_API_URL.
#
#   docker compose -f docker-compose.yml -f docker-compose.otel.yml up --build
#     With the observability stack (OTel collector + Jaeger + Prometheus).
#
# This compose is the local reference for the eventual AWS task definitions.
# Keep service shapes (env vars, ports, healthchecks) in sync with whatever
# IaC ends up describing the production deployment. See docs/DEPLOYMENT.md.

name: flowops

services:
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Build-time env vars baked into the SPA bundle by Vite.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.0.0}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_OLLAMA_URL: ${VITE_OLLAMA_URL:-}
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    image: ${FRONTEND_IMAGE:-flowops/frontend:${IMAGE_TAG:-latest}}
    environment:
      # Runtime env vars — substituted into the nginx config template by the
      # nginx:alpine entrypoint. The frontend service uses them to know which
      # internal hostname to proxy /api and /socket.io to.
      BACKEND_HOST: ${BACKEND_HOST:-api}
      BACKEND_PORT: ${API_PORT:-3000}
      NGINX_PORT: 80
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    networks: [flowops-net]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    # Provide the backend image tag via the BACKEND_IMAGE env var (e.g.
    # `BACKEND_IMAGE=ghcr.io/flowopsaas-glitch/flowops-backend:latest`).
    # The placeholder default of `flowops/backend:latest` will fail with a
    # clear "image not found" error if you haven't set it — better than
    # silently using something stale.
    image: ${BACKEND_IMAGE:-flowops/backend:latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-flowops}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (real secret in prod, please)}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [flowops-net]
    restart: unless-stopped
    healthcheck:
      # Backend MUST expose /health for this to work. If it doesn't, swap to
      # `["CMD-SHELL", "exit 0"]` until it does — but add the endpoint to the
      # backend's hot-path; ALB target groups will need it too.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:${API_PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [flowops-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flowops} -d $${POSTGRES_DB:-flowops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [flowops-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  flowops-net:
    name: flowops-net
    driver: bridge
